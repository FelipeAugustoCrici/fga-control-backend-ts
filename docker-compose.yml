services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fga_control_backend_ts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env aponta pra localhost, que dentro do container é o próprio container.
      # O Postgres e o backend Go continuam rodando no host (via docker-compose
      # do fga-control-backend), então redireciona pro host de fato.
      DATABASE_URL: postgresql://controltasks:controltasks@host.docker.internal:5432/controltasks?schema=public
      GO_BACKEND_URL: http://host.docker.internal:8080
    ports:
      - "${APP_PORT:-8081}:${APP_PORT:-8081}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
